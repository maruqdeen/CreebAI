# Render blueprint. In Render: New → Blueprint → point at this repository.
#
# Two services from one repo: the bot + API, and the static admin panel.
# Secrets are deliberately NOT in this file — every `sync: false` below means
# "prompt me in the dashboard", so nothing sensitive is ever committed.

services:
  # ── Bot + API ────────────────────────────────────────────────────────────
  - type: web
    name: creeb-support-bot
    runtime: python
    plan: free
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"

      # --- Secrets: entered in the dashboard, never in the repo -----------
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL # the Neon connection string
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH # from `python -m app.adminpw`
        sync: false
      - key: ADMIN_TELEGRAM_USER_ID
        sync: false

      # Generated by Render, so they are strong and never leave the dashboard.
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

      # --- Wiring ---------------------------------------------------------
      # PUBLIC_URL is what switches the bot from polling to webhooks. Free
      # instances sleep, and only inbound traffic wakes them — a webhook
      # delivery is that traffic; a polling loop would simply die.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: creeb-support-bot
          property: host
      # The panel is a separate origin, so it has to be allowed through CORS.
      - key: EXTRA_CORS_ORIGINS
        fromService:
          type: web
          name: creeb-support-panel
          property: host
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LOG_LEVEL
        value: INFO

  # ── Admin panel ──────────────────────────────────────────────────────────
  - type: web
    name: creeb-support-panel
    runtime: static
    plan: free
    rootDir: support-desk
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the HTML at build time; see vite.config.js.
      - key: VITE_API_BASE
        fromService:
          type: web
          name: creeb-support-bot
          property: host
    routes:
      # Anything unrecognised goes to the login page rather than a 404, so a
      # bookmarked deep link still lands somewhere useful.
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
