# Render blueprint. In Render: New → Blueprint → point at this repository.
#
# Two services from one repo: the bot + API, and the static admin panel.
# Secrets are deliberately NOT in this file — every `sync: false` below means
# "prompt me in the dashboard", so nothing sensitive is ever committed.

services:
  # ── Bot + API ────────────────────────────────────────────────────────────
  - type: web
    name: creeb-support-bot
    runtime: python
    plan: free
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"

      # --- Secrets: entered in the dashboard, never in the repo -----------
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL # the Neon connection string
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH # from `python -m app.adminpw`
        sync: false
      - key: ADMIN_TELEGRAM_USER_ID
        sync: false

      # Generated by Render, so they are strong and never leave the dashboard.
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

      # --- Wiring ---------------------------------------------------------
      # PUBLIC_URL is deliberately NOT set here. `fromService … property: host`
      # yields the service *name* ("creeb-support-bot"), not an address, and
      # Telegram rejects that with no useful error. Render injects
      # RENDER_EXTERNAL_URL with the real https URL, which the app reads
      # instead — and that is what switches it from polling to webhooks.
      #
      # The panel is a separate origin, so the browser needs it allowed through
      # CORS. Cross-service URLs cannot be wired automatically for the same
      # reason, so paste the panel's URL here, e.g.
      # https://creeb-support-panel.onrender.com
      - key: EXTRA_CORS_ORIGINS
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LOG_LEVEL
        value: INFO

  # ── Admin panel ──────────────────────────────────────────────────────────
  # No `plan` here: static sites have no instance type, they are always free,
  # and setting one fails validation with "no such plan free for service type
  # web".
  - type: web
    name: creeb-support-panel
    runtime: static
    rootDir: support-desk
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the HTML at build time; see vite.config.js. Must be the
      # bot service's full URL, e.g. https://creeb-support-bot.onrender.com —
      # `fromService` would give the bare service name, which the browser would
      # then resolve as a relative path.
      - key: VITE_API_BASE
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
