<!doctype html>
<html lang="en">
  <head>
    <!-- @include('partials.head', {"title":"Sign in","description":"Sign in to the support desk."}) -->
  </head>
  <body class="min-h-dvh" data-page="login">
    <main class="min-h-dvh flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-[26rem]">
        <!-- Book plate, as on the sidebar -->
        <div class="flex items-center gap-2.5 mb-6">
          <svg width="22" height="26" viewBox="0 0 22 26" fill="none" aria-hidden="true" class="shrink-0">
            <rect x="3.5" y="1" width="17.5" height="24" fill="var(--color-leaf)" stroke="var(--color-ink)" stroke-width="1.25" />
            <path d="M7.5 6.5h9.5M7.5 10.5h9.5M7.5 14.5h9.5M7.5 18.5h5.5" stroke="var(--color-ink-3)" stroke-width="1.25" />
            <rect x="1" y="1" width="3.5" height="24" fill="var(--color-stamp)" />
          </svg>
          <div class="leading-tight">
            <div class="text-sm font-bold tracking-tight">Support Log</div>
            <div class="micro !tracking-[0.12em] mt-0.5">Vol. 3 · MMXXVI</div>
          </div>
        </div>

        <div class="bg-leaf border border-edge rounded-sheet">
          <div class="px-5 pt-5 pb-4">
            <div class="micro">Form 00 · Access</div>
            <h1 class="text-xl font-bold tracking-tight mt-1.5">Sign in</h1>
            <p class="text-xs text-ink-2 mt-1.5">
              This desk holds your users' messages and the knowledge base the bot
              answers from.
            </p>
          </div>

          <div class="rule-double mx-5"></div>

          <form class="px-5 py-5 space-y-4" data-login-form novalidate>
            <div>
              <label for="username" class="micro block mb-1.5">Username</label>
              <input
                id="username"
                name="username"
                type="text"
                class="field w-full"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                required
              />
            </div>

            <div>
              <label for="password" class="micro block mb-1.5">Password</label>
              <div class="flex gap-2">
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="field flex-1"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="btn shrink-0"
                  data-secret-toggle="password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </div>

            <!-- Errors land here rather than in a toast: a failed sign-in must
                 stay on screen while the next attempt is typed. -->
            <p
              class="hidden text-xs text-stamp bg-stamp-soft border border-stamp rounded-sheet px-3 py-2"
              role="alert"
              data-login-error
            ></p>

            <button type="submit" class="btn btn-primary btn-lg w-full" data-login-submit>
              Sign in
            </button>
          </form>
        </div>

        <p class="text-2xs text-ink-3 mt-4 leading-relaxed">
          Credentials are set on the server, not here. Generate them with
          <code class="font-mono text-ink-2">python -m app.adminpw</code> and set
          <code class="font-mono text-ink-2">ADMIN_USERNAME</code> and
          <code class="font-mono text-ink-2">ADMIN_PASSWORD_HASH</code> in your host's
          environment.
        </p>
      </div>
    </main>

    <!-- Toast rail, shared with the rest of the panel -->
    <div
      id="toasts"
      class="fixed bottom-4 left-1/2 -translate-x-1/2 lg:left-auto lg:right-5 lg:translate-x-0 z-50 flex flex-col gap-2 pointer-events-none w-[min(22rem,calc(100vw-2rem))]"
      role="status"
      aria-live="polite"
    ></div>
  </body>
</html>
