<!-- Index tabs down the fore-edge of the book. On < lg it becomes a tab strip. -->
<aside
  data-nav="{{ $nav }}"
  class="lg:w-60 lg:shrink-0 lg:h-dvh lg:sticky lg:top-0 flex lg:flex-col bg-band lg:border-r border-b lg:border-b-0 border-rule z-20 sticky top-0"
>
  <!-- Book plate -->
  <div class="hidden lg:block px-4 pt-5 pb-4">
    <div class="flex items-center gap-2.5">
      <svg width="22" height="26" viewBox="0 0 22 26" fill="none" aria-hidden="true" class="shrink-0">
        <rect x="3.5" y="1" width="17.5" height="24" fill="var(--color-leaf)" stroke="var(--color-ink)" stroke-width="1.25" />
        <path d="M7.5 6.5h9.5M7.5 10.5h9.5M7.5 14.5h9.5M7.5 18.5h5.5" stroke="var(--color-ink-3)" stroke-width="1.25" />
        <rect x="1" y="1" width="3.5" height="24" fill="var(--color-stamp)" />
      </svg>
      <div class="leading-tight">
        <div class="text-sm font-bold tracking-tight">Support Log</div>
        <div class="micro !tracking-[0.12em] mt-0.5">Vol. 3 · MMXXVI</div>
      </div>
    </div>
  </div>

  <div class="hidden lg:block h-px bg-rule mx-4"></div>

  <!-- Primary navigation -->
  <nav class="flex-1 lg:pt-4 lg:pl-3 overflow-x-auto lg:overflow-visible" aria-label="Sections">
    <div class="micro hidden lg:block pl-3 pb-2">The Desk</div>
    <ul class="flex lg:flex-col lg:gap-0.5 px-2 lg:px-0 lg:pr-0">
      <li class="shrink-0">
        <a href="/index.html" class="tab-index" data-item="dashboard">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="shrink-0">
            <rect x="1.5" y="1.5" width="13" height="13" stroke="currentColor" stroke-width="1.3" />
            <path d="M1.5 5.5h13M5.5 5.5v9" stroke="currentColor" stroke-width="1.3" />
          </svg>
          <span>Dashboard</span>
          <span class="tab-dot hidden lg:block ml-auto w-1 h-1 rounded-full bg-stamp opacity-0" aria-hidden="true"></span>
        </a>
      </li>
      <li class="shrink-0">
        <a href="/email.html" class="tab-index" data-item="email">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="shrink-0">
            <rect x="1.5" y="3" width="13" height="10" stroke="currentColor" stroke-width="1.3" />
            <path d="M1.5 3.5 8 8.75 14.5 3.5" stroke="currentColor" stroke-width="1.3" />
          </svg>
          <span>Email</span>
          <span
            class="ml-1 lg:ml-auto text-micro font-bold font-mono text-ink-3"
            data-tally="email"
            >—</span
          >
        </a>
      </li>
      <li class="shrink-0">
        <a href="/telegram.html" class="tab-index" data-item="telegram">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="shrink-0">
            <path d="M14.5 2 1.5 7.2l4.1 1.5L14.5 2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M14.5 2 5.6 8.7l.5 4.6 2.3-3.1L14.5 2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
          <span>Telegram</span>
          <span
            class="ml-1 lg:ml-auto text-micro font-bold font-mono text-ink-3"
            data-tally="telegram"
            >—</span
          >
        </a>
      </li>
      <li class="shrink-0">
        <a href="/settings.html" class="tab-index" data-item="settings">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="shrink-0">
            <rect x="2.5" y="1.5" width="11" height="13" stroke="currentColor" stroke-width="1.3" />
            <path d="M5.5 5h5M5.5 8h5" stroke="currentColor" stroke-width="1.3" />
            <path d="m5.5 11 1.4 1.4L9.6 9.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Settings</span>
          <span class="tab-dot hidden lg:block ml-auto w-1 h-1 rounded-full bg-stamp opacity-0" aria-hidden="true"></span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Duty status, at the foot of the page like a signature block -->
  <div class="hidden lg:block px-4 py-4 border-t border-rule">
    <div class="flex items-center justify-between gap-2 mb-2">
      <span class="micro">On Duty</span>
      <button
        type="button"
        class="btn btn-ghost !py-0.5 !px-1.5 !text-micro"
        data-logout
      >
        Sign out
      </button>
    </div>
    <dl class="space-y-1.5">
      <div class="flex items-center justify-between gap-2">
        <dt class="text-2xs text-ink-2 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-edge shrink-0" data-duty-dot="telegram" aria-hidden="true"></span>
          Telegram bot
        </dt>
        <dd class="font-mono text-2xs text-ink-3" data-duty="telegram">—</dd>
      </div>
      <div class="flex items-center justify-between gap-2">
        <dt class="text-2xs text-ink-2 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-edge shrink-0" data-duty-dot="email" aria-hidden="true"></span>
          Email relay
        </dt>
        <dd class="font-mono text-2xs text-ink-3" data-duty="email">—</dd>
      </div>
      <div class="flex items-center justify-between gap-2">
        <dt class="text-2xs text-ink-2 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-carbon shrink-0" aria-hidden="true"></span>
          Groq model
        </dt>
        <dd class="font-mono text-2xs text-ink-3" data-duty="model">—</dd>
      </div>
    </dl>
  </div>
</aside>
