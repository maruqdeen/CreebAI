<!--
  The queue list. Rows are cloned from the template below and filled from
  GET /api/queries — the markup stays here in HTML so it remains the single
  place the row is designed, and so it ports to a Blade @foreach unchanged.
-->

<!-- Loading: skeleton rows, not a spinner over empty space. -->
<div data-log-skeleton>
  <div class="log-row md:!grid-cols-[5.5rem_1fr_5rem_7.5rem] md:!gap-4" aria-hidden="true">
    <span class="h-3 w-14 bg-edge/60 rounded-[1px] animate-pulse"></span>
    <span class="min-w-0">
      <span class="block h-3 w-2/3 bg-edge/60 rounded-[1px] animate-pulse"></span>
      <span class="block h-2.5 w-1/3 bg-edge/40 rounded-[1px] mt-2 animate-pulse"></span>
    </span>
    <span class="hidden md:block h-3 w-8 bg-edge/40 rounded-[1px] ml-auto animate-pulse"></span>
    <span class="h-6 w-16 bg-edge/40 rounded-[1px] ml-auto animate-pulse"></span>
  </div>
  <div class="log-row md:!grid-cols-[5.5rem_1fr_5rem_7.5rem] md:!gap-4" aria-hidden="true">
    <span class="h-3 w-14 bg-edge/60 rounded-[1px] animate-pulse"></span>
    <span class="min-w-0">
      <span class="block h-3 w-1/2 bg-edge/60 rounded-[1px] animate-pulse"></span>
      <span class="block h-2.5 w-1/4 bg-edge/40 rounded-[1px] mt-2 animate-pulse"></span>
    </span>
    <span class="hidden md:block h-3 w-8 bg-edge/40 rounded-[1px] ml-auto animate-pulse"></span>
    <span class="h-6 w-16 bg-edge/40 rounded-[1px] ml-auto animate-pulse"></span>
  </div>
  <span class="sr-only">Loading the queue…</span>
</div>

<ul data-log class="hidden"></ul>

<template id="tpl-query">
  <li class="log-row md:!grid-cols-[5.5rem_1fr_5rem_7.5rem] md:!gap-4">
    <span class="log-ref" data-field="ref"></span>
    <span class="min-w-0">
      <span class="block text-sm md:truncate" data-field="body"></span>
      <span class="block text-2xs text-ink-3 mt-0.5 md:truncate" data-field="meta"></span>
    </span>
    <span class="hidden md:block font-mono text-2xs text-right" data-field="confidence"></span>
    <span class="text-right" data-field="disposition"></span>
  </li>
</template>

<template id="tpl-reply-button">
  <button class="btn" data-reply>
    Reply
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
      <path d="M2 6h8m0 0L6.5 2.5M10 6 6.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</template>

<!-- Empty state: teaches the interface rather than announcing nothing. -->
<div class="hidden py-14 px-4 text-center" data-empty>
  <svg width="34" height="34" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="mx-auto text-edge">
    <rect x="2.5" y="1.5" width="11" height="13" stroke="currentColor" stroke-width="1" />
    <path d="M5.5 5.5h5M5.5 8h5" stroke="currentColor" stroke-width="1" />
    <path d="m5.5 11 1.4 1.4 2.7-2.6" stroke="var(--color-filed)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <h3 class="text-sm font-bold mt-3" data-empty-title>The queue is clear</h3>
  <p class="text-xs text-ink-2 mt-1.5 max-w-[46ch] mx-auto leading-relaxed" data-empty-body>
    Every question matched something in your knowledge base. Anything the bot
    can't answer — or anything a rule holds back — lands here.
  </p>
  <a href="/settings.html" class="btn mt-4" data-empty-action>Add to the knowledge base</a>
</div>
