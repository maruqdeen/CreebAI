<!--
  Shown when the Python service in ../bot cannot be reached. The panel is a
  window onto that service; without it every figure on the page would be a
  guess, so say so plainly rather than rendering zeroes that look like facts.
-->
<div class="px-4 lg:px-6 pt-4 hidden" data-offline>
  <div class="max-w-[88rem] bg-stamp-soft border border-stamp rounded-sheet p-3.5 flex flex-wrap items-start gap-x-4 gap-y-2">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="mt-0.5 shrink-0 text-stamp">
      <path d="M8 1.5 15 14H1L8 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
      <path d="M8 6v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="8" cy="11.6" r=".8" fill="currentColor" />
    </svg>
    <div class="flex-1 min-w-[16rem]">
      <h2 class="text-xs font-bold text-stamp">The support service isn't running</h2>
      <p class="text-2xs text-ink-2 mt-1 leading-relaxed max-w-[62ch]">
        Nothing on this page is live. Start it and reload:
      </p>
      <code class="block font-mono text-2xs text-ink bg-leaf border border-edge rounded-sheet px-2 py-1.5 mt-2 overflow-x-auto"
        >cd bot &amp;&amp; .venv/bin/python -m app.main</code
      >
    </div>
    <button type="button" class="btn shrink-0" data-retry>Retry</button>
  </div>
</div>
